# TRMNL form fields for the redesign: the whole form, to paste into the
# beta fork now and to replace config/settings.yaml when the redesign
# ships. TRMNL is still edited by hand.
#
# What changed from settings.yaml, and why none of it moves a saved value:
#
#   show_future_suggestions  Same key, same "Yes" and "No". A third value,
#                            "visual", turns on Visual Forecast (the day's
#                            outfits side by side), so the words and the
#                            pictures can't both be on. Markup from before
#                            reads anything but no/false/0 as on, so if
#                            this form ships first, "visual" shows words.
#   sarcasm_level            Same key and values; the label now says it
#                            works with words and Visual Forecast alike.
#   topical_lines            New (was prototypes/fact-flavour/settings-topical.yaml).
#   latitude, longitude      Same keys, now in a collapsed group.
#
# conditional_validation only hides fields in the form; their saved values
# stay, and the markup never needs them while hidden (no forecast: no words
# at all; sarcasm off: no sarcastic line, so no topical one). The `when`
# values and the shape are from TRMNL's docs, untested: build the same rule
# once in TRMNL's visual form builder and compare before relying on it.
#
# Adding a language means adding an option to the `language` field below
# AND shipping lang/<code>.json. See docs/TRANSLATING.md.
- keyname: author_bio
  field_type: author_bio
  name: About this plugin
  # Before shipping: add the release to the changelog below, e.g.
  # "v1.3.0 – <date> New: Visual Forecast. Pick it under Forecast and the
  # day's outfits line up side by side: what to wear now, and from when
  # the next one fits, until the evening. ..." plus the German entry.
  description: "Getting out the door has never been this easy!<br>Your TRMNL now reads your local weather forecast and tells you exactly what to wear.<br>Keep it simple with the perfect outfit for right now, or turn on future hints for clothing suggestions based on upcoming weather changes. Choose a kid-friendly tone or dial the sarcasm all the way up to eleven.<br>Comes with 30+ hand-drawn outfits, including festive themes that unlock throughout the year.<br>Install (don't Fork!) to automatically receive new outfits and updates.<br><br>v1.2.0 – 2026-09-03
New light jacket outfit for the gap between hoodie and puffer, plus an extra cold band so freezing and properly freezing finally look different. Future hints now name the layer you're actually wearing and add the timing, so you know when the jacket comes off or the sweatshirt goes back on. All three tones rewritten: neutral got warmer, sarcastic got more range, and eleven got a narrator who makes it personal.<br>v1.1.0 – 2026-01-23 What to Wear now speaks Deutsch. Added German future outfit suggestions and expanded the English text library with more variety across future weather conditions and sarcasm levels.<br> <br>v1.0.1 - 2025-11-26 Time is now calculated based on coordinates, not local time of device. Dedicated to everyone using TRMNL to dissociate into a sunny mini-vacation."
  category: "life,environment"
  description-de: "Noch nie war es so einfach, aus dem Haus zu gehen!<br>Dein TRMNL liest jetzt die lokale Wettervorhersage und sagt dir genau, was du anziehen solltest.<br>Halte es simpel mit dem perfekten Outfit für den aktuellen Moment oder aktiviere Zukunftstipps für Kleidungsvorschläge basierend auf bevorstehenden Wetteränderungen. Wählen einen kinderfreundlichen Ton oder drehen den Sarkasmus bis zum Anschlag auf.<br>Mit über 30 handgezeichneten Outfits, darunter festliche Designs, die im Laufe des Jahres freigeschaltet werden. <br>Installieren (nicht forken!), um zukünftig neue Outfits und Updates zu erhalten.<br><br>v1.1.0 – 2026-01-23
What to Wear spricht jetzt Deutsch. Deutsche Hinweise für zukünftige Outfits wurden ergänzt und die englische Textbibliothek um mehr Varianten für unterschiedliche Wetterverläufe und Sarkasmus-Stufen erweitert. <br><br>v1.0.1 – 26.11.2025 Die Zeit wird nun anhand von Koordinaten berechnet und nicht mehr anhand der Ortszeit des Geräts. Gewidmet allen, die TRMNL nutzen, um sich in einen sonnigen Kurzurlaub zu versetzen."
- keyname: lat_lon
  field_type: lat_lon
  name: Location
  description: Search for a city or postal code, or provide a comma-separated lat/long.
  description-de: "Suche nach Stadt oder Postleitzahl, oder gib Breiten- und Längengrad durch Komma getrennt ein."
  # Deliberately NOT optional: see the note in config/settings.yaml.
- keyname: location_label
  field_type: string
  name: Location name
  description: Optional. Name will be shown in the bottom bar
  optional: true
  description-de: "Optional. Name wird in der Fußleiste angezeigt"
- keyname: show_future_suggestions
  field_type: select
  name: Forecast
  description: "What's coming later today: in words, or as Visual Forecast (new), the day's outfits side by side from now until the evening. Off keeps it to what to wear right now."
  description-de: "Was später am Tag kommt: in Worten oder als Visual Forecast (neu), die Outfits des Tages nebeneinander, von jetzt bis zum Abend. Aus zeigt nur, was du gerade anziehen solltest."
  default: "Yes"
  options:
  - "Off: just what to wear now": "No"
  - "In words": "Yes"
  - "Visual Forecast (new)": "visual"
  conditional_validation:
  - when: "No"
    hidden:
    - sarcasm_level
    - topical_lines
- keyname: language
  field_type: select
  name: In what language should the clothing suggestions be shown?
  default: "en"
  options:
  - English: "en"
  - German: "de"
  description-de: "In welcher Sprache sollen die Kleidungsvorschläge angezeigt werden?"
- keyname: sarcasm_level
  field_type: select
  name: Sarcasm
  description: "A sarcastic line under the forecast, in words or Visual Forecast alike. Off, on, or up to 11."
  description-de: "Ein sarkastischer Satz unter der Vorhersage, in Worten wie im Visual Forecast. Aus, an, oder auf 11 gedreht."
  default: "10"
  options:
  - "Off": 0
  - "On": 10
  - 11: 11
  conditional_validation:
  - when: 0
    hidden:
    - topical_lines
- keyname: topical_lines
  field_type: select
  name: Jokes about current events
  description: "Now and then the sarcastic line is about something in the news: sport, records, the clocks changing. Never politics, crime or tragedies."
  description-de: "Ab und zu geht der sarkastische Satz um etwas Aktuelles: Sport, Rekorde, die Zeitumstellung. Nie Politik, Verbrechen oder Unglücke."
  default: "on"
  optional: true
  options:
  - "Off": "off"
  - "On": "on"
  # New installs get the default, "on". Installs from before the field have
  # no value saved, and the markup treats no value as off, so nobody who
  # installed the plugin for the weather starts seeing news jokes unasked.
  # Check this in TRMNL's editor before shipping: if TRMNL fills in the
  # default for existing installs too, change the default to "off".
  # optional: true because the field can be hidden, and a hidden required
  # field can fail the form's check on save (TRMNL's docs).
- keyname: temp_preference
  field_type: select
  name: Do you run cold or warm?
  description: "Optional. Shifts every outfit suggestion up or down the scale to match how you actually feel the cold."
  default: "0"
  optional: true
  options:
  - "I'm always cold": -4
  - "I feel the cold": -2
  - "Average": 0
  - "I run warm": 2
  - "I'm always hot": 4
  description-de: "Optional. Verschiebt alle Kleidungsvorschläge nach oben oder unten, je nachdem, wie du Kälte tatsächlich empfindest."
  # Words, not degrees, and one uniform shift: see config/settings.yaml.
- keyname: show_bottom_bar
  field_type: select
  name: Title bar
  description: "Do you want to show or hide the bottom title bar?"
  default: "on"
  options:
  - Show: "on"
  - Hide: "off"
  description-de: "Willst du die untere Titelleiste ausblenden oder anzeigen?"

# Superseded by lat_lon and kept, folded away: deleting them is the one
# step of the location migration that can break a working install. See
# config/settings.yaml and docs/MIGRATION.md.
- keyname: latitude
  field_type: string
  name: Latitude (legacy)
  description: "Superseded by Location above. Leave as is."
  optional: true
  group: "Old location fields"
  description-de: "Wird durch das Feld Ort ersetzt. Unverändert lassen."
- keyname: longitude
  field_type: string
  name: Longitude (legacy)
  description: "Superseded by Location above. Leave as is."
  optional: true
  group: "Old location fields"
  description-de: "Wird durch das Feld Ort ersetzt. Unverändert lassen."
