name: prune topical lines

# Topical lines carry a date window and stop showing on their own; this
# takes the expired ones out of the served language files so every poll
# doesn't keep carrying them. tools/topical.py add prunes too, so this
# only matters in weeks when nothing new is added. Scheduled workflows
# run on the default branch only.

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Drop expired topical lines
        run: python3 tools/topical.py prune --lang-dir lang

      - name: Commit, if anything expired
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain review/topical-archive.json)" ]; then
            echo "nothing expired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lang review/topical-archive.json
          git commit -m "Prune expired topical lines"
          git push
